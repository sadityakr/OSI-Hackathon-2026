[project]
name = "ramanlens"
version = "0.0.1"
description = "Processing package of the Raman analysis skill: readers, preprocessing, peak fitting, reference matching, polarization, cited relations"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pillow>=10",
  "marimo>=0.9",
  "nbformat>=5",
  "nbconvert[webpdf]>=7",
]

[project.optional-dependencies]
trace = ["langsmith>=0.2", "anthropic>=0.40"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only the package: the rl*.py scripts next to it are run as files, and its data is read from ../resources,
# so install editable (pip install -e) to keep the package beside its resources.
[tool.setuptools.packages.find]
where = ["."]
include = ["ramanlens*"]
