    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "3513aa285ecd11d258c42a0504100949", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e139077eb45db564c629556415e87e77", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"tldr\"\u003ETL;DR\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EQuestion:\u003C/strong\u003E how thick is each of six CrSBr flakes from the same crystal (532 nm, room temperature)?\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ESignal used:\u003C/strong\u003E the Ag1 mode position, which stiffens with layer number (Torres et al. 2022, arXiv:2212.01754, Fig. 1h).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAg1 per flake:\u003C/strong\u003E C 103.1, E 103.3, A 108.6, F 111.9, D 113.3, B 114.0 cm\u207b\u00b9.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERanking, thinnest to thickest:\u003C/strong\u003E A \u0026lt; F \u0026lt; D \u0026lt; B, with B bulk-like.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ENot determinable:\u003C/strong\u003E C and E. Their Ag1 lies below the published monolayer value, so the agent did not assign a layer number.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ECheck added after the run\u003C/strong\u003E (the agent never saw it): the AFM order is C 1L \u0026lt; E 2L \u0026lt; A 3L \u0026lt; F 5L \u0026lt; D 6L \u0026lt; B bulk, so the ranking of A, F, D and B is correct.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "70e3552aed616c4913370aa2a3ed9a77", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0d44568ed69081d30e6b38e7e85f2f87", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9e8687c0b093989f72034592f7602c53", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"raman-analysis-crsbr-six-exfoliated-flakes-same-crystal\"\u003ERaman analysis: CrSBr (six exfoliated flakes, same crystal)\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EQuestion.\u003C/strong\u003E How thick is each of the six flakes?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EConditions.\u003C/strong\u003E substrate SiO2/Si, laser 532 nm, 295 K,\n6 spectra, series variable: flake \u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EAssumed.\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003ESubstrate SiO2/Si (not stated; standard for exfoliated CrSBr). It sets thin-film interference of the Ag2/Ag3 intensity ratio.\u003C/li\u003E\n\u003Cli\u003EUnpolarized or unknown polarization relative to the a/b axes: Ag2 is polarization and energy dependent, so only positions and widths are used, not intensity ratios.\u003C/li\u003E\n\u003Cli\u003ESpectra window is 51 to 431 cm-1 with no Si line, so no per-spectrum calibration offset can be measured; the 1.2 cm-1 point spacing limits shift precision.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "409c02a865863d13a4653bf84ec4a3e0", "console": [], "id": "PKri", "outputs": [{"data": {"application/vnd.marimo+mimebundle": "{\"image/png\": \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABvMAAANwCAYAAAASj5aXAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3QecXGXV+PGzvfee3dTd9EYSCCG00IsiAiooEBFQQXhBXgVfQQX73y6IoCJFQFCRovQeekhI771tstnee/t/zrlzJ7Ob3WSTLTO7+/uSy70zc/fO3TuzM/c+5znnCWpvb28XAAAAAAAAAAAAAAEn2N87AAAAAAAAAAAAAKBrBPMAAAAAAAAAAACAAEUwDwAAAAAAAAAAAAhQBPMAAAAAAAAAAACAAEUwDwAAAAAAAAAAAAhQBPMAAAAAAAAAAACAAEUwDwAAAAAAAAAAAAhQBPMAAAAAAAAAAACAAEUwDwAAAAAAAAAAAAhQBPMAAAAAAAAAAACAAEUwDwAAAAAAAAAAAAhQBPMAAAAAAAAAAACAAEUwDwAAAAAAAAAAAAhQBP Cem\u003ETorres 2022, Fig. 1g-h: layer-dependent Raman spectra (1.58 eV) and Ag mode positions versus layer number\u003C/em\u003E [1]\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "3aba285df33a29d6dcba1751e381f4d7", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"6-method-notes\"\u003E6. Method notes\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003ELorentzian line shapes on an asymmetric least squares baseline (Eilers and Boelens 2005).\u003C/li\u003E\n\u003Cli\u003ELayer number is read from the layer-dependent redshift of Ag1 and Ag2 with Ag3 as a layer-independent internal reference, the observable Torres et al. use [1]; they and Ye et al. caution that layer number is better fixed by optical contrast or AFM [3].\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bb3d3be5e8a38e9493bcba0ecfa3f65f", "console": [], "id": "emfo", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"4b-ag2-minus-ag1-spacing-calibration-independent\"\u003E4b. Ag2 minus Ag1 spacing (calibration-independent)\u003C/h2\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='emfo-0' random-id='4f162f61-7d39-bb68-4951-3a32c9e75244'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;flake\u0026#92;\u0026quot;:\u0026#92;\u0026quot;A\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Ag2-Ag1 (cm-1)\u0026#92;\u0026quot;:132.88,\u0026#92;\u0026quot;fit err (cm-1)\u0026#92;\u0026quot;:0.11,\u0026#92;\u0026quot;Ag3 (cm-1)\u0026#92;\u0026quot;:341.12,\u0026#92;\u0026quot;Ag1 FWHM\u0026#92;\u0026quot;:7.31},{\u0026#92;\u0026quot;flake\u0026#92;\u0026quot;:\u0026#92;\u0026quot;B\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Ag2-Ag1 (cm-1)\u0026#92;\u0026quot;:130.39,\u0026#92;\u0026quot;fit err (cm-1)\u0026#92;\u0026quot;:0.08,\u0026#92;\u0026quot;Ag3 (cm-1)\u0026#92;\u0026quot;:342.88,\u0026#92;\u0026quot;Ag1 FWHM\u0026#92;\u0026quot;:3.88},{\u0026#92;\u0026quot;flake\u0026#92;\u0026quot;:\u0026#92;\u0026quot;C\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Ag2-Ag1 (cm-1)\u0026#92;\u0026quot;:135.0,\u0026#92;\u0026quot;fit err (cm-1)\u0026#92;\u0026quot;:0.38,\u0026#92;\u0026quot;Ag3 (cm-1)\u0026#92;\u0026quot;:340.85,\u0026#92;\u0026quot;Ag1 FWHM\u0026#92;\u0026quot;:11.38},{\u0026#92;\u0026quot;flake\u0026#92;\u0026quot;:\u0026#92;\u0026quot;D\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Ag2-Ag1 (cm-1)\u0026#92;\u0026quot;:130.61,\u0026#92;\u0026quot;fit err (cm-1)\u0026#92;\u0026quot;:0.05,\u0026#92;\u0026quot;Ag3 (cm-1)\u0026#92;\u0026quot;:342.07,\u0026#92;\u0026quot;Ag1 FWHM\u0026#92;\u0026quot;:4.4},{\u0026#92;\u0026quot;flake\u0026#92;\u0026quot;:\u0026#92;\u0026quot;E\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Ag2-Ag1 (cm-1)\u0026#92;\u0026quot;:135.26,\u0026#92;\u0026quot;fit err (cm-1)\u0026#92;\u0026quot;:0.24,\u0026#92;\u0026quot;Ag3 (cm-1)\u0026#92;\u0026quot;:340.19,\u0026#92;\u0026quot;Ag1 FWHM\u0026#92;\u0026quot;:11.08},{\u0026#92;\u0026quot;flake\u0026#92;\u0026quot;:\u0026#92;\u0026quot;F\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Ag2-Ag1 (cm-1)\u0026#92;\u0026quot;:131.33,\u0026#92;\u0026quot;fit err (cm-1)\u0026#92;\u0026quot;:0.08,\u0026#92;\u0026quot;Ag3 (cm-1)\u0026#92;\u0026quot;:340.55,\u0026#92;\u0026quot;Ag1 FWHM\u0026#92;\u0026quot;:4.71}]\u0026quot;' data-total-rows='6' data-total-columns='5' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-show-filters='false' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "ee05ec9a806f8ddb61e7d8027e94bbe5", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"7-interpretation\"\u003E7. Interpretation\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E[measured] Flakes B and D show narrow Ag1/Ag2 (Ag1 FWHM 3.9 cm-1 and 4.4 cm-1) at Ag1 114.0 +- 0.1 cm-1 and 113.3 +- 0.1 cm-1, Ag2 244.4 +- 0.1 cm-1 and 243.9 +- 0.1 cm-1, giving Ag2-Ag1 = 130.4 cm-1 and 130.6 cm-1. [literature] Ag1 saturates near 113 to 114 cm-1 and Ag2 near 244 to 245 cm-1 from about 3L to bulk (Torres Fig. 1h, read off, about +-1 cm-1) [1]; 4L at 2.33 eV is 114 / 244 [2]. Reading: \u003Cstrong\u003EB and D are bulk-like, at least about 4 layers; Raman cannot give an upper bound\u003C/strong\u003E, because both modes are flat above that. Confidence: moderate.\u003C/li\u003E\n\u003Cli\u003E[measured] Flake F: Ag1 111.9 +- 0.1 cm-1, Ag2 243.2 +- 0.1 cm-1, spacing 131.3 cm-1, about 0.7 to 0.9 cm-1 larger than B and D (fit error about 0.1 cm-1, same excitation and settings). [inferred] F is thinner than B and D. Against Torres Fig. 1h (spacing read off: 2L about 132.3, 3L about 131.6, 4L about 131.4, bulk about 130.7 cm-1) [1] it sits at about 3L to 4L, but the whole 3L to bulk range is only about 1 cm-1 wide, comparable to the +-1 cm-1 read-off error. Best estimate 3L (range 2L to bulk). Confidence: low to moderate.\u003C/li\u003E\n\u003Cli\u003E[measured] Flake A: Ag1 108.6 +- 0.1 cm-1 (FWHM 7.3 cm-1, about twice the others), Ag2 241.4 +- 0.1 cm-1, spacing 132.9 cm-1. [literature] 1L about 134.1 and 2L about 132.3 cm-1 spacing, Ag1 106.7 (1L) and 111 (2L) [1]. Reading: \u003Cstrong\u003EA is the thinnest, 1L to 2L, best estimate 2L\u003C/strong\u003E. 1L vs 2L is not separated by this data. Confidence: low to moderate.\u003C/li\u003E\n\u003Cli\u003E[measured] Flakes C and E give Ag1 103.0 +- 0.2 cm-1 and 103.3 +- 0.2 cm-1, Ag2 238.1 +- 0.3 cm-1 and 238.5 +- 0.1 cm-1, all broad (Ag1 FWHM 11.4 cm-1 and 11.1 cm-1) with a broad band near 302 cm-1 and broad humps at 80 to 110 cm-1. Spacing 135.0 cm-1 and 135.3 cm-1 exceeds the 1L value of about 134.1 cm-1 [1], and Ag1 lies below 1L (106.7), which no layer number explains. \u003Cstrong\u003EThickness is not determinable for C and E from these spectra.\u003C/strong\u003E\u003C/li\u003E\n\u003Cli\u003E[literature] Candidate explanation for C and E: surface defect mode D1 5 to 10 cm-1 below Ag1, strongest in thin flakes and growing with air exposure, which merges with Ag1 and drags the fitted position down [1]; defect and resonant modes near 300 cm-1 are reported along b [1]. This is a hypothesis; it is not tested here.\u003C/li\u003E\n\u003Cli\u003E[measured] Ag3 should be nearly layer independent at about 343.5 to 344 cm-1 [1, 2], but here it ranges over 340.2 +- 0.1 cm-1 (E) to 342.9 +- 0.1 cm-1 (B), with D 342.1 +- 0.1 cm-1, F 340.6 +- 0.1 cm-1, A 341.1 +- 0.1 cm-1, C 340.9 +- 0.1 cm-1. [inferred] A spread of about 2.7 cm-1 is far more than thickness explains, so flake-to-flake calibration, heating or strain differences of at least 1 to 3 cm-1 are possible. That is why absolute positions are not used alone and the spacing is preferred; if the Ag3 deficit were a rigid calibration offset, F would move toward bulk-like.\u003C/li\u003E\n\u003Cli\u003E[inferred] Ranking from thinnest to thickest by the calibration-independent spacing: A \u0026lt; F \u0026lt; D about B; C and E unplaced. Absolute layer numbers rest on a figure measured at 1.58 eV [1] compared with data at 2.33 eV; the two published 4L/bulk sets differ by about 1 to 1.4 cm-1 in spacing [1, 2].\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "67ce9e12ce1c2783a4e777185e4d9016", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"8-limits-and-questions\"\u003E8. Limits and questions\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003ERaman gives layer number only up to about 4L: Ag1 and Ag2 are flat from about 3L to bulk, so B and D can be 4L or 50 nm. Optical contrast or AFM step height is the decisive measurement; Torres and Ye both rely on it [1, 3].\u003C/li\u003E\n\u003Cli\u003ENo Si line in the 51 to 431 cm-1 window, so calibration offsets are unmeasured. Ag3 scatters by about 2.7 cm-1 between flakes. A Si 520.7 cm-1 reference in each spectrum would settle whether absolute positions can be used.\u003C/li\u003E\n\u003Cli\u003EReference positions were read from a 1.58 eV (resonant) figure [1]; these data are 2.33 eV. A 2.33 eV thickness series on AFM-characterised flakes would remove that mismatch.\u003C/li\u003E\n\u003Cli\u003EPolarization relative to a/b is unknown. Ag2 intensity depends on it and on laser energy [2], so intensity ratios were not used.\u003C/li\u003E\n\u003Cli\u003EC and E (broad, weak Ag1/Ag2, 302 cm-1 band) need a fresh-spot spectrum, a longer-air-exposure comparison and AFM; the degradation hypothesis is untested.\u003C/li\u003E\n\u003Cli\u003EQuestions: substrate and oxide thickness? Which flakes were measured in air for how long? Laser power (heating)? Do you have optical contrast or AFM for any of them?\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0dbb3a7989b5adeb9cfef004e5cdaffb", "console": [], "id": "iLit", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"references\"\u003EReferences\u003C/h2\u003E\n\u003Col\u003E\n\u003Cli\u003ETorres et al., 2022, Probing defects and spin-phonon coupling in CrSBr via resonant Raman scattering, arXiv:2212.01754. \u003Ca href=\"https://arxiv.org/abs/2212.01754\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Elink\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003EMondal et al., 2025, npj 2D Mater., arXiv:2410.22164 (values from the skill's CrSBr note, p.2; paper not reopened). \u003Ca href=\"https://arxiv.org/abs/2410.22164\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Elink\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003EYe et al., 2022, ACS Nano 16, 11876 (cited from the skill's CrSBr note, journal p.5-6; paper not opened). \u003Ca href=\"https://doi.org/10.1021/acsnano.2c01151\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Elink\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.2", "script_metadata_hash": null}, "version": "1"},
