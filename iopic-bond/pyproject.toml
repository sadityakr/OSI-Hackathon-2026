[project]
name = "iopic-bond"
version = "0.1.0"
description = "Local MCP server over Valency Bond: find papers, parse them into graphs, show their figures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "httpx2",          # the HTTP client mcp 2.x uses; we pass our own for the Bond bearer header
  "httpx>=0.27",
  "pillow>=10",
  "platformdirs>=4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
parse = ["docling>=2.0"]
trace = ["langsmith>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
iopic-bond = "iopic_bond.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iopic_bond = ["ui/*.html"]
