<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Cross-domain demonstrations</title>
  <desc id="desc">Mean absolute parameter-error reduction of physics-constrained estimators over simple baselines, 100 paired synthetic realisations per field: XRD 99.4 percent, NMR 98.8 percent, photoluminescence 84.7 percent, astronomy emission lines 42.0 percent, self-avoiding walks 99.5 percent.</desc>
  <style>
    .bg{fill:#ffffff}
    .t{fill:#1f2328;font:600 14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#1f2328;font:12.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{fill:#59636e;font:12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .v{fill:#1f2328;font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace}
    .ours{fill:#1a7f37}
    .track{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .t,.s,.v{fill:#e6edf3}
      .m{fill:#9198a1}
      .ours{fill:#3fb950}
      .track{fill:#161b22;stroke:#3d444d}
    }
  </style>
  <rect class="bg" x="0" y="0" width="100%" height="100%" rx="12"/>
  <text class="t" x="20" y="30">Mean absolute-error reduction: physics-constrained estimator vs simple baseline</text>
  <text class="m" x="20" y="50">100 paired synthetic realisations per field. Matched-model demonstrations, not a validation of the agent.</text>

  <text class="s" x="20" y="92">Materials science: XRD lattice parameter</text>
  <rect class="track" x="360" y="78" width="480" height="20" rx="3"/><rect class="ours" x="360" y="78" width="477" height="20" rx="3"/><text class="v" x="848" y="93">99.4%</text>
  <text class="s" x="20" y="136">Chemistry: NMR signal analysis</text>
  <rect class="track" x="360" y="122" width="480" height="20" rx="3"/><rect class="ours" x="360" y="122" width="474" height="20" rx="3"/><text class="v" x="848" y="137">98.8%</text>
  <text class="s" x="20" y="180">Physics: photoluminescence band gap</text>
  <rect class="track" x="360" y="166" width="480" height="20" rx="3"/><rect class="ours" x="360" y="166" width="407" height="20" rx="3"/><text class="v" x="848" y="181">84.7%</text>
  <text class="s" x="20" y="224">Astronomy: galaxy emission lines</text>
  <rect class="track" x="360" y="210" width="480" height="20" rx="3"/><rect class="ours" x="360" y="210" width="202" height="20" rx="3"/><text class="v" x="848" y="225">42.0%</text>
  <text class="s" x="20" y="268">Mathematics: self-avoiding walks</text>
  <rect class="track" x="360" y="254" width="480" height="20" rx="3"/><rect class="ours" x="360" y="254" width="478" height="20" rx="3"/><text class="v" x="848" y="269">99.5%</text>

  <text class="m" x="20" y="314">Data and code: submission/supplementary/ (benchmark_cases.csv, build.py, OSI_Supplement.pdf)</text>
</svg>
