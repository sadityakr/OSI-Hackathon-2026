[project]
name = "ramanlens"
version = "0.0.1"
description = "Raman interpretation agent with cited relations and figure-level literature grounding"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "lmfit>=1.3",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pymupdf>=1.24",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pillow>=10",
  "marimo>=0.9",
  "nbformat>=5",
  "nbconvert[webpdf]>=7",
]

[project.optional-dependencies]
trace = ["langsmith>=0.2"]
pdf = ["docling>=2.0"]
ml = ["torch>=2.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ramanlens*"]

# ship the literature mode tables with non-editable installs too
[tool.setuptools.package-data]
"ramanlens.literature" = ["tables/*.json"]
